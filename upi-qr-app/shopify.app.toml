# Filled in automatically by `shopify app config link` (see README.md).
client_id = ""
name = "DecorIn UPI QR"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# read_products (which product page) + read_content + write_content let the "DecorIn reviews" admin block list, approve, hide and delete reviews (blog comments).
scopes = "read_products,read_content,write_content"

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[webhooks]
api_version = "2026-10"

[build]
include_config_on_deploy = true
